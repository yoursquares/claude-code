<!DOCTYPE html>
<html lang="de">
<head>

  <title>Immersive Listing — 2040</title>

  <style>

<body class="bg-neutral-950 text-neutral-100 antialiased">

        <div class="col-span-2 aspect-[16/10] rounded-2xl bg-white/5 border border-white/10"></div>
        <div class="aspect-square rounded-2xl bg-white/5 border border-white/10"></div>

              <div class="h-3 w-56 bg-white/5 rounded"></div>

                <div class="h-6 w-20 rounded-full bg-white/5"></div>

            <div class="text-right space-y-2">
              <div class="h-6 w-28 bg-white/15 rounded ml-auto"></div>
              <div class="h-9 w-24 rounded-full bg-white ml-auto"></div>

          </div>
          <div class="glass bg-white/5 border border-white/10 rounded-2xl p-5 flex items-center gap-5">
            <div class="w-20 h-20 rounded-xl bg-white/10"></div>
            <div class="flex-1 space-y-2">

            <div class="w-20 h-20 rounded-xl bg-white/10"></div>
            <div class="flex-1 space-y-2">

              <div class="h-3 w-56 bg-white/5 rounded"></div>

            <div class="text-right space-y-2">

    <div class="max-w-[1600px] mx-auto">
      <div class="mb-12 space-y-3">
        <div class="h-3 w-20 bg-white/10 rounded"></div>

    <div class="max-w-[1600px] mx-auto">
